[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cflowdist"
version = "2026.06.06"
description = "A framework to trace carbon flows in Swiss distribution grids using open data."
authors = [
  { name="Wenyu Liu", email="wenyu.liu@epfl.ch" },
  { name="Enea Figini", email="enea.figini@epfl.ch" },
  { name="Mario Paolone", email="mario.paolone@epfl.ch" }
]
license = "GPL-3.0-or-later"
license-files = ["LICEN[CS]E*"]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "cvxpy==1.8.1",
  "pandas==2.3.3",
  "numpy==2.3.5",
  "shapely==2.0.6",
  "matplotlib>=3.7",
  "timezonefinder>=6.5.5",
  "geopandas==1.0.1",
  "pandapower==3.4.0",
  "pyproj>=3.6.1",
  "scipy==1.16.3",
  "folium==0.18.0",
  "branca==0.8.0",
  "pytz==2023.3.post1",
  "fiona==1.10.0",
  "openmeteo_requests==1.3.0",
  "pvlib==0.13.0",
  "demandlib==0.2.1",
  "workalendar==17.0.0",
  "pyarrow==21.0.0",
  "highspy==1.11.0",
  "numba>=0.57.1"
]


[tool.setuptools]
packages = ["cflowdist"]